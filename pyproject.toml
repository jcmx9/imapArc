[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imaparc"
dynamic = ["version"]
description = "Archive IMAP mailboxes into Maildir, optionally render to searchable PDF/A."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "jcmx9", email = "jcmx9@tutamail.com" },
]
keywords = ["email", "eml", "pdf", "pdfa", "archive", "imap"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Communications :: Email",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.0",
    "playwright>=1.44",
    "pikepdf>=9.0",
    "img2pdf>=0.5",
    "pillow>=10.0",
    "pillow-heif>=0.16",
    "lxml>=5.0",
    "jinja2>=3.1",
    "puremagic>=1.28",
    "rich>=13.0",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.2.2",
    "imapclient>=3.1.0",
]

[project.scripts]
imaparc = "imaparc.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "syrupy>=4.6",
    "ruff>=0.4",
    "mypy>=1.10",
    "bump-my-version>=1.1",
    "pre-commit>=3.7",
    "lxml-stubs>=0.5",
    "pytest-asyncio>=1.4.0",
    "types-pyyaml>=6.0.12.20260724",
]

[project.urls]
Homepage = "https://github.com/jcmx9/imapArc"
Repository = "https://github.com/jcmx9/imapArc"
Issues = "https://github.com/jcmx9/imapArc/issues"

[tool.hatch.version]
path = "src/imaparc/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/imaparc"]

[tool.bumpversion]
current_version = "26.8.0"
commit = true
tag = true
tag_name = "v{new_version}"
tag_message = "Release {new_version}"
commit_message = "release: {new_version}"
parse = "(?P<year>\\d{2})\\.(?P<month>\\d{1,2})\\.(?P<micro>\\d+)(\\.dev(?P<dev>\\d+))?"
serialize = [
    "{year}.{month}.{micro}.dev{dev}",
    "{year}.{month}.{micro}",
]

[[tool.bumpversion.files]]
filename = "src/imaparc/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "README.md"
search = "Version `{current_version}`"
replace = "Version `{new_version}`"

[[tool.bumpversion.files]]
filename = "README.en.md"
search = "Version `{current_version}`"
replace = "Version `{new_version}`"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=src/imaparc --cov-report=term-missing -n auto"
asyncio_mode = "auto"
markers = [
    "slow: end-to-end tests that run the full pipeline",
    "requires_chromium: needs a Playwright Chromium install",
    "requires_tools: needs gs/qpdf/verapdf on PATH",
]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
# None of these ship type stubs or a py.typed marker.
module = ["img2pdf", "pillow_heif", "imapclient"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/imaparc"]
branch = true
omit = ["src/imaparc/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]
