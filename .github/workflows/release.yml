name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      # The repository is private and installed via `uv tool install git+ssh://`,
      # so nothing is published to PyPI. Building here is a smoke test that the
      # tagged tree packages cleanly, and the artifacts are attached below.
      - name: Build distribution
        run: uv build

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          # Only the distributions — `dist/*` also picked up the .gitignore that
          # uv writes there, which ended up as a "default.gitignore" release asset.
          files: |
            dist/*.whl
            dist/*.tar.gz
          # `release.sh dev` tags .devN pre-releases on the dev branch; those
          # must not show up as the latest stable release.
          prerelease: ${{ contains(github.ref_name, '.dev') }}
